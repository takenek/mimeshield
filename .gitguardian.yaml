# GitGuardian / ggshield configuration (format v2).
# "version: 2" is required, otherwise ggshield treats the file as the deprecated v1 format.
version: 2

secret:
  # tests/fixtures/ holds the PUBLIC, TEST-ONLY PKI generated by tests/fixtures/generate.sh
  # (fictional "MIME Shield Test Root CA", example.test addresses, password committed in
  # generate.sh). Those keys protect nothing and must stay in the repository for the test
  # suite, so secret scanning skips this directory. Anything outside it is still scanned.
  ignored_paths:
    - 'tests/fixtures/**/*'
