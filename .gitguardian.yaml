# GitGuardian / ggshield configuration (format v2).
# "version: 2" is required, otherwise ggshield treats the file as the deprecated v1 format.
version: 2

secret:
  # tests/fixtures/pki/ holds the PUBLIC, TEST-ONLY PKI generated by tests/fixtures/generate.sh
  # (fictional "MIME Shield Test Root CA", example.test addresses). Those keys protect nothing and
  # must stay in the repository for the test suite. The other entries are the harness files that
  # carry the fixture password and the credentials of the throw-away test databases and mailboxes
  # created by tests/e2e/setup.sh - narrow, named exceptions instead of whole directories (audit
  # N-13). Everything else, including the rest of tests/, is scanned.
  ignored_paths:
    - 'tests/fixtures/pki/**/*'
    - 'tests/fixtures/generate.sh'
    - 'tests/TestPki.php'
    - 'tests/interop/run.sh'
    - 'tests/e2e/setup.sh'
    - 'tests/e2e/test_e2e.py'
    - 'tests/e2e/smtpsink.py'
    - 'tests/ui/test_ui.py'
